name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Tests
        run: cargo test

  build:
    needs: quality
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: deskd-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: deskd-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: deskd-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools perl

      # Stamp Cargo.toml from the tag name so the built binary reports the
      # actual release semver via CARGO_PKG_VERSION (#482). Cargo.toml stays
      # at 0.1.0 in-tree; the version is only injected at release-build time.
      # `perl -pi -e` works on both GNU sed (Linux) and BSD sed (macOS) runners.
      - name: Stamp version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Guard against non-semver tags (e.g. someone tagging `latest`).
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not yield a valid semver ('$VERSION')"
            exit 1
          fi
          echo "Stamping Cargo.toml with version $VERSION"
          perl -pi -e "s/^version = \".*\"/version = \"$VERSION\"/ if /^\\[package\\]/../^\\[/" Cargo.toml
          grep '^version' Cargo.toml

      - name: Build (Linux musl)
        if: contains(matrix.target, 'musl')
        run: cargo build --release --target ${{ matrix.target }} --features vendored-openssl

      - name: Build (macOS)
        if: contains(matrix.target, 'apple')
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/deskd ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: deskd-*
          generate_release_notes: true

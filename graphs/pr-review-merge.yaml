graph: pr-review-merge
version: 1
description: >
  Review and merge a PR: check CI, review diff, rebase on main,
  run quality checks, squash merge, tag, notify Telegram.

inputs:
  repo: kgatilin/deskd
  pr_number: ""
  branch: ""
  title: ""

steps:
  - id: check_ci
    tools:
      - tool: bash
        args: "gh pr checks {pr_number} --repo {repo} 2>&1 || true"
      - tool: bash
        args: "gh pr view {pr_number} --repo {repo} --json mergeable,headRefName,title,body,statusCheckRollup 2>&1"

  - id: review_diff
    tools:
      - tool: bash
        args: "gh pr diff {pr_number} --repo {repo} 2>&1"

  - id: decide_merge
    type: llm
    depends_on: [check_ci, review_diff]
    prompt: |
      You are reviewing PR #{pr_number} in {repo}.

      Repo {repo} is PUBLIC. Every committed line is world-readable forever.

      Walk these checks in order; ANY single failure flips action to "comment":

      1. **CI** — passing? (ignore archlint failures; only cargo check/test/clippy are hard gates.)

      2. **Functional / code quality** — bugs, broken invariants, dead code, bad patterns,
         missing tests for new behaviour.

      3. **Security (hard stop)** — read the diff explicitly for:
         - hardcoded secrets / tokens / API keys / private URLs / .env content (in code, tests, fixtures)
         - shell / SQL / YAML / path-traversal injection from untrusted input
         - new endpoints without auth, missing CSRF, weak session cookie attrs
         - untrusted deserialization without size/depth limits
         - new outbound network calls (data exfil surface), new privileged FS writes
         - rolled-your-own crypto, weak primitives (MD5/SHA1 for security, ECB, predictable IV/nonce)
         - suspicious / typosquat dependencies

      4. **Public-repo sensitivity (hard stop)** — read the diff explicitly for leaks of:
         - personal context about the repo owner (family, finances, business, health, exact location,
           schedule, private contacts)
         - internal infra: VPS public IPs, Tailscale internal IPs (100.x.x.x), Tailscale hostnames,
           internal domains, SSH keys/fingerprints, bot tokens, Telegram chat IDs (-100…), webhook URLs
         - references to internal ecosystem names / governance / sibling private repos
         - other agents' identities, internal agent prompts, named persona refs
         - TODO comments naming private people / private context

      5. **Mergeable** — no conflicts with main.

      If steps 3 or 4 trigger, list the SPECIFIC offending lines or symbols in `issues` — don't be vague.

      Respond with JSON:
      ```json
      {
        "action": "merge" or "comment",
        "branch": "the head branch name",
        "title": "PR title for commit message",
        "issues": ["list of issues if action is comment, empty if merge — be specific, cite file:line"]
      }
      ```

  - id: fetch_branch
    depends_on: [decide_merge]
    condition: "'merge' in action"
    tools:
      - tool: bash
        args: "cd {work_dir} && git fetch origin && git fetch kira 2>&1 || true"

  - id: rebase_branch
    depends_on: [fetch_branch]
    condition: "'merge' in action"
    tools:
      - tool: bash
        args: |
          cd {work_dir} && \
          if git rev-parse --verify origin/{branch} >/dev/null 2>&1; then \
            REMOTE=origin; \
          elif git rev-parse --verify kira/{branch} >/dev/null 2>&1; then \
            REMOTE=kira; \
          else \
            echo "FATAL: branch {branch} not found on origin or kira (post-fetch)" >&2; exit 1; \
          fi && \
          echo "PR branch resolved to: $REMOTE/{branch}" && \
          git checkout -B _pr_{pr_number} $REMOTE/{branch} 2>&1 && \
          git rebase main 2>&1

  - id: quality_check
    depends_on: [rebase_branch]
    condition: "'merge' in action"
    parallel: true
    tools:
      - tool: bash
        args: "cd {work_dir} && ~/.cargo/bin/cargo fmt --check 2>&1"
      - tool: bash
        args: "cd {work_dir} && ~/.cargo/bin/cargo clippy -- -D warnings 2>&1"

  - id: fix_fmt
    depends_on: [quality_check]
    condition: "'merge' in action"
    tools:
      - tool: bash
        args: "cd {work_dir} && ~/.cargo/bin/cargo fmt 2>&1"

  # Single atomic step: merge via GH API → wait for merge → tag release.
  # Uses `gh pr merge --squash` so the PR ends with state=closed AND
  # merged=true (not the closed-not-merged state #475/#496 hit when we
  # used `git merge --squash + push` directly, which bypasses GitHub's
  # merge API).
  #
  # `--auto` enables auto-merge so transient CI flicker doesn't break the
  # graph; it returns immediately after enabling, so we poll for the
  # merged state before tagging. `set -euo pipefail` aborts on any
  # failure before the tag step.
  - id: merge_close_tag
    depends_on: [fix_fmt]
    condition: "'merge' in action"
    tools:
      - tool: bash
        args: |
          set -euo pipefail
          cd {work_dir}
          # 1. Merge via GH API (squash + delete remote branch atomically).
          gh pr merge {pr_number} --repo {repo} --squash --auto --delete-branch
          # 2. Wait for the merge to actually complete (--auto returns immediately).
          for i in $(seq 1 30); do
            STATE=$(gh pr view {pr_number} --repo {repo} --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then break; fi
            sleep 2
          done
          if [ "$STATE" != "MERGED" ]; then
            echo "FATAL: PR {pr_number} did not reach MERGED state within 60s (last state: $STATE)" >&2
            exit 1
          fi
          # 3. Sync local main with the new merge commit before tagging.
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          # 4. Local cleanup of the temp branch (non-fatal).
          git branch -D _pr_{pr_number} 2>/dev/null || true
          # 5. Tag a patch release from the new main.
          LATEST=$(git tag -l 'v*' | sort -V | tail -1)
          MAJOR=$(echo $LATEST | cut -d. -f1)
          MINOR=$(echo $LATEST | cut -d. -f2)
          PATCH=$(echo $LATEST | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH+1))"
          git tag $NEXT
          git push origin $NEXT
          echo "tagged: $NEXT"

  - id: comment_issues
    depends_on: [decide_merge]
    condition: "'comment' in action"
    tools:
      - tool: bash
        args: "gh pr review {pr_number} --repo {repo} --comment --body '{issues}' 2>&1"

  - id: notify_telegram
    depends_on: [merge_close_tag, comment_issues]
    type: llm
    prompt: |
      Based on the results, compose a brief Telegram notification (2-3 lines).
      If merged: mention PR number, title, new tag.
      If commented: mention PR number and what needs fixing.
      Output just the message text, nothing else.
